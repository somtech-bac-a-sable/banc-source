name: secrets
on:
  workflow_dispatch:
jobs:
  lire:
    runs-on: ubuntu-latest
    environment: banc-env
    steps:
      - name: Longueurs seulement, jamais les valeurs
        env:
          S1: ${{ secrets.BANC_SECRET }}
          S2: ${{ secrets.BANC_ENV_SECRET }}
          V1: ${{ vars.BANC_VAR }}
        run: |
          echo "BANC_SECRET longueur=${#S1}"
          echo "BANC_ENV_SECRET longueur=${#S2}"
          echo "BANC_VAR longueur=${#V1}"
