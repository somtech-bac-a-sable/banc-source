name: publier
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connexion au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construire et publier l'image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/banc-image:latest"
          echo "image visee : $IMG"
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMG" .
          docker push "$IMG"
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Publier le paquet npm
        run: |
          npm version "0.0.${{ github.run_number }}-${{ github.run_attempt }}" --no-git-tag-version
          echo "paquet vise : $(node -p "require('./package.json').name")"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
